name: Ver21 affinity regression
on:
  push:
    branches:
      - main
      - feature/ver21-race-affinity
      - feature/ver22-elizabeth
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  affinity-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # requirements.txt does not pin pandas, so Streamlit Cloud may install 3.x.
        pandas: ['>=2,<3', '>=3,<4']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "pandas${{ matrix.pandas }}" requests beautifulsoup4 streamlit
      - run: python -m compileall -q keiba_affinity.py keiba_affinity_adapter.py keiba_affinity_collect.py keiba_affinity_pipeline.py keiba_affinity_store.py keiba_affinity_workflow.py keiba_core.py 'pages/2_過去レース相性_Ver21.py' tests/test_keiba_affinity.py tests/test_keiba_affinity_adapter.py tests/test_keiba_affinity_collect.py tests/test_keiba_affinity_pipeline.py tests/test_keiba_affinity_store.py tests/test_keiba_affinity_streamlit.py tests/test_keiba_affinity_workflow.py
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: 2025 one-race one-horse live smoke (diagnostic only)
        if: matrix.pandas == '>=2,<3'
        continue-on-error: true
        run: PYTHONPATH=. python scripts/ver21_live_probe.py
