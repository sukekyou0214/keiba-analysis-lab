name: Ver21 affinity regression
on:
  push:
    branches:
      - feature/ver21-race-affinity
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  affinity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "pandas>=2,<3"
      - run: python -m compileall -q keiba_affinity.py tests/test_keiba_affinity.py
      - run: python -m unittest discover -s tests -p 'test_keiba_affinity.py' -v
