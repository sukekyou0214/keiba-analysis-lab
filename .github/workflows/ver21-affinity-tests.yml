name: Ver21 affinity regression
on:
  push:
    branches:
      - feature/ver21-race-affinity
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  affinity-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install "pandas>=2,<3" requests beautifulsoup4 streamlit
      - run: python -m compileall -q keiba_affinity.py keiba_affinity_adapter.py keiba_affinity_collect.py keiba_affinity_pipeline.py keiba_affinity_store.py keiba_affinity_workflow.py keiba_core.py 'pages/2_過去レース相性_Ver21.py' tests/test_keiba_affinity.py tests/test_keiba_affinity_adapter.py tests/test_keiba_affinity_collect.py tests/test_keiba_affinity_pipeline.py tests/test_keiba_affinity_store.py tests/test_keiba_affinity_streamlit.py tests/test_keiba_affinity_workflow.py
      - run: python -m unittest discover -s tests -p 'test_keiba_affinity*.py' -v
      - name: 2025 one-race one-horse live smoke (diagnostic only)
        continue-on-error: true
        run: PYTHONPATH=. python scripts/ver21_live_probe.py
      - name: One-time 2016-2025 all-horse live acceptance audit
        id: liveall
        continue-on-error: true
        timeout-minutes: 15
        run: PYTHONPATH=. python scripts/ver21_full_history_audit.py
      - name: Preserve live audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ver21-ten-year-evidence
          path: ver21-audit-output/
          if-no-files-found: ignore
          retention-days: 30
